<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route Map CP</title>
<link rel="stylesheet" href="lib/leaflet.css"><script src="lib/leaflet.js"></script><script src="lib/jszip.min.js"></script><script src="lib/pmtiles.js"></script><script src="config.js"></script>
<style>
:root{--bd:#1F4E79;--bg:#232529;--bg2:#1b1d20;--ln:#34373c;--tx:#e8e8e8;--mu:#9aa0a6;--au:#F2B43C;--cy:#5BC0EB}
*{box-sizing:border-box}body{margin:0;font:13px Tahoma,"Leelawadee UI",sans-serif;display:flex;height:100vh;background:var(--bg2);color:var(--tx)}
#side{width:clamp(300px,19vw,400px);flex:none;overflow:auto;background:var(--bg);border-right:1px solid #000;scrollbar-color:#555 var(--bg)}
#map{flex:1;background:#e8e3c8}
body.hide #side{display:none}
#hdr{padding:14px 14px 10px;border-bottom:1px solid var(--ln)}#hdr b{font-size:18px}#hdr small{display:block;margin-top:4px;color:var(--cy);font:11px Consolas,monospace;letter-spacing:.5px}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln)}
#stats div{color:var(--mu);font-size:12px}#stats b{display:block;color:var(--tx);font:15px Consolas,monospace;margin-top:2px}
fieldset{margin:0;border:0;border-bottom:1px solid var(--ln);padding:12px 14px}legend{float:left;width:100%;font-weight:bold;font-size:13px;margin-bottom:8px;color:var(--tx)}
label{color:var(--mu)}
input,select,button{font:inherit;color:var(--tx)}input.s{width:60px}
input:not([type=checkbox]),select{background:var(--bg2);border:1px solid var(--ln);border-radius:4px;padding:5px 7px;font-family:Consolas,monospace}
input:focus,select:focus{outline:1px solid var(--cy);border-color:var(--cy)}input[type=checkbox]{accent-color:var(--cy)}
button{background:#3a3d42;border:1px solid #4a4d52;border-radius:4px;padding:6px 10px;margin:2px 0;cursor:pointer}button:hover{background:#474a50}
button.pri{background:var(--au);border-color:var(--au);color:#1b1d20;font-weight:bold}button.pri:hover{filter:brightness(1.08)}
table.wp{border-collapse:collapse;width:100%}table.wp th{color:var(--mu);font-weight:normal;text-align:left;padding:4px 2px;border-bottom:1px solid var(--ln)}
table.wp td{padding:3px 2px;border-bottom:1px solid var(--ln)}
table.wp input{width:100%;border:0;background:transparent;padding:3px}table.wp select{border:0}
table.wp button{padding:2px 6px;color:var(--cy)}table.wp button+button{color:#ff6b6b}
#legs{margin-top:8px;font-family:Consolas,monospace;font-size:12px}#legs div{padding:4px 0;border-bottom:1px dotted var(--ln)}#legs b{color:var(--au)}
.leaflet-bar a{background:var(--bg);color:var(--tx);border-color:var(--ln)}.leaflet-bar a:hover{background:#3a3d42}
.lbl{pointer-events:auto;color:#000}.box{color:#000}
fieldset label{display:block;margin:4px 0}
.lbl .t{border:2px solid #000;padding:3px 10px;font-size:14px;white-space:nowrap;text-align:center;box-shadow:1px 1px 3px #0006}
.lbl table{border-collapse:collapse;background:#fff;margin:2px auto 0;font-size:11px}
.lbl td{border:1px solid #000;padding:1px 6px;text-align:center;min-width:42px}
.box{display:flex;align-items:stretch;height:44px;filter:drop-shadow(1px 1px 2px #0006)}
.box .tip{width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-right:20px solid var(--bd);position:relative}
.box .tip:after{content:"";position:absolute;left:4px;top:-17px;border-top:17px solid transparent;border-bottom:17px solid transparent;border-right:15px solid #fff}
.box .c{width:30px;border:3px solid var(--bd);border-left-width:0;background:#fff;display:flex;align-items:center;justify-content:center}
.box .c:first-of-type{border-left-width:0}
.box .c span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;white-space:nowrap}
.hint{color:var(--mu);font-size:12px;padding:0 14px 14px}
#side>button{margin:12px 14px 8px;width:calc(100% - 28px)}
@media print{#side{display:none}}
</style></head><body>
<div id="side">
 <div id="hdr"><b>FalconView CP</b><small>ROUTE PLANNER · PZ / CP / LZ</small></div>
 <div id="stats"><div>Distance<b id="stD">-</b></div><div>Flight Time<b id="stT">-</b></div><div>Waypoints<b id="stN">-</b></div><div>GS<b id="stK">-</b></div></div>
 <fieldset><legend>แผนที่ (tiles)</legend>
  URL <input id="tileUrl" style="width:100%" value="map.pmtiles" placeholder="map.pmtiles หรือ tiles/{z}/{x}/{y}.png">
  <label><input type="checkbox" id="tms"> TMS (gdal2tiles ไม่ได้ใส่ --xyz)</label>
  <label><input type="checkbox" id="osm"> OSM ออนไลน์ (ทดสอบ)</label>
  <button class="pri" onclick="setBase()">โหลดแผนที่</button>
 </fieldset>
 <fieldset><legend>ค่าการบิน</legend>
  GS <input id="kt" class="s" type="number" value="90"> kt &nbsp; VAR <input id="var" class="s" type="number" step="0.1" value="0"> (E=+)
  &nbsp;<label><input type="checkbox" id="mag"> แสดงเป็น MH</label>
 </fieldset>
 <fieldset><legend>จุด (คลิกบนแผนที่เพื่อเพิ่ม, ลากจุด/ป้าย/กล่องได้)</legend>
  <table class="wp"><thead><tr><th>Type</th><th>Name</th><th>Lat</th><th>Lon</th><th>Alt ft</th><th></th></tr></thead><tbody id="wpb"></tbody></table>
  <div id="legs"></div>
 </fieldset>
 <fieldset><legend>ไฟล์</legend>
  <input type="file" id="imp" accept=".csv,.kml,.kmz,.gpx" hidden onchange="importFile(this.files[0]);this.value=''">
  <button class="pri" onclick="imp.click()">Import (CSV/KML/KMZ/GPX)</button>
  <button onclick="exportCSV()">Export CSV</button> <button onclick="exportKML()">Export KML</button>
  <button onclick="if(confirm('ลบทุกจุด?')){S.pts=[];draw()}">ล้าง</button>
 </fieldset>
 <button onclick="document.body.classList.add('hide');map.invalidateSize()">ซ่อนแถบ (กด Esc เพื่อแสดง) แล้วจับภาพ/Print</button>
 <p class="hint">PZ = ▲ ชมพู, CP = □ เขียว, LZ = ● เหลือง. เวลา = H:MM. ข้อมูลบันทึกในเบราว์เซอร์อัตโนมัติ</p>
</div>
<div id="map"></div>
<script>
const COL={PZ:'#FF66CC',CP:'#22BB33',LZ:'#FFD700'};
const $=id=>document.getElementById(id);
let S={pts:[]};try{S=JSON.parse(localStorage.getItem('routeS'))||S}catch(e){}
const map=L.map('map',{zoomSnap:0.25}).setView([16.12,103.55],11);
let base=null;
function pmLayer(u){const p=new pmtiles.PMTiles(u),l=pmtiles.leafletRasterLayer(p,{maxZoom:18,maxNativeZoom:12});
  p.getHeader().then(h=>{l.options.maxNativeZoom=h.maxZoom;l.options.minNativeZoom=h.minZoom;l.redraw()}).catch(()=>{});return l;}
function setBase(){ if(base)map.removeLayer(base);
  base=$('osm').checked?L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19})
    :/\.pmtiles$/i.test($('tileUrl').value)?pmLayer($('tileUrl').value)
    :L.tileLayer($('tileUrl').value,{tms:$('tms').checked,maxZoom:18,maxNativeZoom:16,errorTileUrl:''});
  base.addTo(map); save(); }
const grp=L.layerGroup().addTo(map);
const kind=t=>(t||'').toUpperCase().slice(0,2);
const col=t=>COL[kind(t)]||COL.CP;
function legCalc(a,b){const r=Math.PI/180,[p1,l1,p2,l2]=[a.lat*r,a.lon*r,b.lat*r,b.lon*r];
  const d=2*Math.asin(Math.sqrt(Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin((l2-l1)/2)**2));
  const y=Math.sin(l2-l1)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(l2-l1);
  return {nm:d*3440.065,tc:(Math.atan2(y,x)/r+360)%360};}
const hm=m=>{m=Math.round(m);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
const pad3=x=>String(Math.round(x)%360).padStart(3,'0');
function legs(){const kt=+$('kt').value||90,v=+$('var').value||0;
  return S.pts.slice(1).map((b,i)=>{const a=S.pts[i],c=legCalc(a,b);
    return {...c,crs:$('mag').checked?(c.tc-v+360)%360:c.tc,min:c.nm/kt*60,alt:a.alt}});}
function save(){S.cfg={url:$('tileUrl').value,tms:$('tms').checked,osm:$('osm').checked,kt:$('kt').value,v:$('var').value,mag:$('mag').checked};
  try{localStorage.setItem('routeS',JSON.stringify(S))}catch(e){}}
function shape(t){const c=kind(t);
  if(c==='PZ')return '<svg width="26" height="24"><polygon points="13,2 24,22 2,22" fill="#F5A800" stroke="#1F4E79" stroke-width="2.5"/></svg>';
  if(c==='LZ')return '<svg width="26" height="26"><circle cx="13" cy="13" r="11" fill="#F5A800" stroke="#1F4E79" stroke-width="2.5"/></svg>';
  return '<svg width="18" height="18"><rect x="2" y="2" width="14" height="14" fill="none" stroke="#000" stroke-width="3"/></svg>';}
function draw(){grp.clearLayers();const L_=legs(),n=S.pts.length;
  const tot=L_.reduce((s,l)=>s+l.nm,0),tmin=L_.reduce((s,l)=>s+l.min,0);let cn=0,cm=0;
  S.pts.forEach((p,i)=>{ if(i>0){cn+=L_[i-1].nm;cm+=L_[i-1].min}
    const first=i===0,last=i===n-1,sz=kind(p.type)==='CP'?18:26;
    const mk=L.marker([p.lat,p.lon],{draggable:true,icon:L.divIcon({className:'',html:shape(p.type),iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]})}).addTo(grp);
    mk.on('dragend',e=>{const q=e.target.getLatLng();p.lat=+q.lat.toFixed(6);p.lon=+q.lng.toFixed(6);draw()});
    if(!p.lbl)p.lbl=[p.lat+0.05,p.lon];
    const tbl=`<table><tr><td></td><td>NM</td><td>MIN</td></tr>
      <tr><td>TOTAL</td><td>${Math.round(tot)}</td><td>${hm(tmin)}</td></tr>
      <tr><td>ACTUAL</td><td>${first?'-':Math.round(cn)}</td><td>${first?'-':hm(cm)}</td></tr>
      <tr><td>REMAIN</td><td>${last?'-':Math.round(tot-cn)}</td><td>${last?'-':hm(tmin-cm)}</td></tr></table>`;
    L.polyline([[p.lat,p.lon],p.lbl],{color:'#000',weight:2}).addTo(grp);
    const lb=L.marker(p.lbl,{draggable:true,icon:L.divIcon({className:'lbl',iconSize:null,iconAnchor:[0,0],
      html:`<div style="transform:translate(-50%,-50%)"><div class="t" style="background:${col(p.type)}">${esc(p.type)} ${esc(p.name)}</div>${tbl}</div>`})}).addTo(grp);
    lb.on('dragend',e=>{const q=e.target.getLatLng();p.lbl=[q.lat,q.lng];draw()});
  });
  L_.forEach((l,i)=>{const a=S.pts[i],b=S.pts[i+1];
    L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{color:'#000',weight:3,dashArray:'10 8'}).addTo(grp);
    if(!a.box)a.box=[(a.lat+b.lat)/2-0.04,(a.lon+b.lon)/2];
    const cells=[pad3(l.crs),Math.round(l.nm)+' NM',hm(l.min),a.alt?a.alt+"'":'-'].map(t=>`<div class="c"><span>${t}</span></div>`).join('');
    const bx=L.marker(a.box,{draggable:true,icon:L.divIcon({className:'',iconSize:null,iconAnchor:[0,0],
      html:`<div style="transform:translate(-50%,-50%) rotate(${l.tc-270}deg)"><div class="box"><div class="tip"></div>${cells}</div></div>`})}).addTo(grp);
    bx.on('dragend',e=>{const q=e.target.getLatLng();a.box=[q.lat,q.lng];draw()});
  });
  table(L_,tot,tmin);save();}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function table(L_,tot,tmin){
  $('wpb').innerHTML=S.pts.map((p,i)=>`<tr>
   <td><input value="${esc(p.type)}" style="width:40px" onchange="S.pts[${i}].type=this.value;draw()"></td>
   <td><input value="${esc(p.name)}" onchange="S.pts[${i}].name=this.value;draw()"></td>
   <td><input value="${p.lat}" onchange="S.pts[${i}].lat=+this.value;draw()"></td>
   <td><input value="${p.lon}" onchange="S.pts[${i}].lon=+this.value;draw()"></td>
   <td><input value="${esc(p.alt)}" style="width:44px" onchange="S.pts[${i}].alt=this.value;draw()"></td>
   <td style="white-space:nowrap"><button onclick="mv(${i},-1)">↑</button><button onclick="S.pts.splice(${i},1);draw()">✕</button></td></tr>`).join('');
  $('legs').innerHTML=L_.map((l,i)=>`<div>Leg ${i+1} ${esc(S.pts[i].type)}→${esc(S.pts[i+1].type)}: <b>${pad3(l.crs)}°</b> ${l.nm.toFixed(1)} NM ${hm(l.min)}</div>`).join('')
    +(L_.length?`<div><b>TOTAL ${tot.toFixed(1)} NM ${hm(tmin)}</b></div>`:'');
  $('stD').textContent=tot.toFixed(1)+' NM';$('stT').textContent=hm(tmin);$('stN').textContent=S.pts.length;$('stK').textContent=(+$('kt').value||90)+' kt';}
function mv(i,d){if(i+d<0)return;[S.pts[i],S.pts[i+d]]=[S.pts[i+d],S.pts[i]];draw()}
map.on('click',e=>{const n=S.pts.length;
  const type=prompt('Type (PZ / CP1 / CP2 / LZ)',n?('CP'+n):'PZ');if(!type)return;
  const name=prompt('ชื่อจุด','')??'';const alt=prompt('ความสูง leg ที่ออกจากจุดนี้ (ft)','1100')??'';
  S.pts.push({type,name,lat:+e.latlng.lat.toFixed(6),lon:+e.latlng.lng.toFixed(6),alt});draw()});
['kt','var','mag'].forEach(id=>$(id).onchange=draw);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('hide');map.invalidateSize()}});
// ---- import ----
function guessType(name,i,n){const m=/^(PZ|LZ|CP\d*|SP|RP)\b/i.exec(name||'');if(m)return m[1].toUpperCase();return i===0?'PZ':i===n-1?'LZ':'CP'+i}
function setPts(arr){const n=arr.length;S.pts=arr.map((p,i)=>{const t=p.type||guessType(p.name,i,n);
  let nm=p.name||'';if(nm.toUpperCase().startsWith(t))nm=nm.slice(t.length).trim();return {type:t,name:nm,lat:+p.lat,lon:+p.lon,alt:p.alt||''}});
  draw();if(n)map.fitBounds(S.pts.map(p=>[p.lat,p.lon]),{padding:[80,80]});}
function parseCSV(t){const rows=t.trim().split(/\r?\n/).map(r=>r.split(','));const h=rows.shift().map(s=>s.trim().toLowerCase());
  const g=(r,k)=>r[h.findIndex(x=>x.startsWith(k))];return rows.map(r=>({type:g(r,'type'),name:g(r,'name'),lat:g(r,'lat'),lon:g(r,'lon'),alt:g(r,'alt')}));}
function parseXML(t){const d=new DOMParser().parseFromString(t,'text/xml'),out=[];
  const tx=(e,s)=>e.getElementsByTagName(s)[0]?.textContent.trim();
  for(const w of d.querySelectorAll('wpt,rtept'))out.push({name:tx(w,'name'),lat:w.getAttribute('lat'),lon:w.getAttribute('lon')});
  if(!out.length)for(const pm of d.getElementsByTagName('Placemark')){const pt=pm.getElementsByTagName('Point')[0];
    if(pt){const [lo,la]=tx(pt,'coordinates').split(',');out.push({name:tx(pm,'name'),lat:la,lon:lo})}}
  if(!out.length){const ls=d.getElementsByTagName('LineString')[0];if(ls)tx(ls,'coordinates').split(/\s+/).forEach(c=>{const[lo,la]=c.split(',');out.push({lat:la,lon:lo})})}
  return out;}
async function importFile(f){if(!f)return;let t;
  if(/\.kmz$/i.test(f.name)){const z=await JSZip.loadAsync(f);const k=Object.keys(z.files).find(n=>/\.kml$/i.test(n));t=await z.file(k).async('string')}
  else t=await f.text();
  const arr=/\.csv$/i.test(f.name)?parseCSV(t):parseXML(t);if(!arr.length)return alert('ไม่พบจุดในไฟล์');setPts(arr);}
// ---- export ----
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+txt],{type}));a.download=name;a.click()}
function exportCSV(){dl('route.csv','type,name,lat,lon,alt_ft\n'+S.pts.map(p=>[p.type,p.name,p.lat,p.lon,p.alt].join(',')).join('\n'),'text/csv')}
function exportKML(){const L_=legs();
  const pm=S.pts.map(p=>`<Placemark><name>${esc(p.type+' '+p.name)}</name><Point><coordinates>${p.lon},${p.lat},0</coordinates></Point></Placemark>`).join('');
  const ln=L_.map((l,i)=>`<Placemark><name>Leg ${i+1} ${pad3(l.crs)} ${Math.round(l.nm)}NM ${hm(l.min)} ${S.pts[i].alt||''}</name><Style><LineStyle><color>ff000000</color><width>3</width></LineStyle></Style><LineString><tessellate>1</tessellate><coordinates>${S.pts[i].lon},${S.pts[i].lat},0 ${S.pts[i+1].lon},${S.pts[i+1].lat},0</coordinates></LineString></Placemark>`).join('');
  dl('route.kml',`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Route</name>${pm}${ln}</Document></kml>`,'application/vnd.google-earth.kml+xml')}
// ---- init ----
const qm=new URLSearchParams(location.search).get('map')||(window.CONFIG&&CONFIG.MAP_URL);
if(S.cfg){$('tileUrl').value=S.cfg.url||$('tileUrl').value;$('tms').checked=!!S.cfg.tms;$('osm').checked=!!S.cfg.osm;$('kt').value=S.cfg.kt||90;$('var').value=S.cfg.v||0;$('mag').checked=!!S.cfg.mag}
if(!S.pts.length)S.pts=[{type:'PZ',name:'ท่าอากาศยานร้อยเอ็ด',lat:16.1168,lon:103.7741,alt:'1100'},{type:'CP2',name:'สนาม ฮ. พล.ร.6',lat:16.105,lon:103.545,alt:'1100'},{type:'LZ',name:'สนาม ฮ. รร.สารคามพิทยาคม',lat:16.184,lon:103.3,alt:''}];
if(qm)$('tileUrl').value=qm;
setBase();draw();map.fitBounds(S.pts.map(p=>[p.lat,p.lon]),{padding:[120,120]});
</script></body></html>
